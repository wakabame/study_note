[project]
name = "study_note"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "wakabame", email = "wakabame89@gmail.com" }
]
dependencies = [
    "numpy>=2.0.1",
    "matplotlib>=3.9.1",
    "jax>=0.4.31",
    "diffrax>=0.6.0",
    "sympy>=1.13.2",
    "tqdm>=4.66.5",
]
requires-python = ">=3.12.3"
readme = "README.md"

[dependency-groups]
dev = [
    "ruff>=0.6.5",
    "pre-commit>=3.7.1",
    "pytest>=8.2.1",
    "mypy>=1.10.0",
    "jupyter>=1.0.0",
    "quartodoc>=0.7.5",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []

fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 120
exclude = '''
(
    venv
    | .mypy_cache
    | .pytest_cache
)
'''
