name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        run: ./setup-uv.sh
      - name: Load cached venv
        id: cache_dependency_python
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
      - name: Install python module
        if: ${{ steps.cache_dependency_python.outputs.cache-hit != 'true' }}
        run: |
          uv sync
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.549
      - name: Build Docs
        run: |
          uv run quartodoc build --config docs/_quarto.yml
          find notebook/ -name "*.ipynb" | while read file; do
            output_file=$(echo "$file" | sed 's|notebook/\([^/]*\)/|docs/\1/notebook/|; s|.ipynb$|.qmd|')
            mkdir -p $(dirname "$output_file")
            quarto convert "$file" --output "$output_file"
          done
          uv venv
          quarto render docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

  deploy:
    needs: build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
